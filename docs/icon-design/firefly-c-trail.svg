<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2D5E"/>
      <stop offset="0.55" stop-color="#191B3F"/>
      <stop offset="1" stop-color="#0C0D24"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF3B0" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#FFE45C" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F5C842" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F5C842" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#F8CE4B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFE45C" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#dusk)"/>

  <!-- looping dashed trail, tapering toward the firefly -->
  <path d="M 218 812
           C 120 700 220 560 360 590
           C 520 626 560 780 434 806
           C 322 828 300 690 420 622
           C 540 554 594 480 646 414"
        fill="none" stroke="url(#trail)" stroke-width="22"
        stroke-linecap="round" stroke-dasharray="2 68" filter="url(#soft)"/>

  <!-- the firefly: bright dot upper right -->
  <circle cx="676" cy="376" r="250" fill="url(#halo)"/>
  <circle cx="676" cy="376" r="64" fill="#FFFDF0"/>
  <circle cx="676" cy="376" r="94" fill="#FFE45C" opacity="0.55" filter="url(#soft)"/>

  <!-- tiny distant companion -->
  <circle cx="266" cy="286" r="9" fill="#FFE99C" opacity="0.5" filter="url(#soft)"/>
</svg>
