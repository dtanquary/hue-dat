<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2D5E"/>
      <stop offset="0.55" stop-color="#191B3F"/>
      <stop offset="1" stop-color="#0C0D24"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE45C" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#F5C842" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F5C842" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE072"/>
      <stop offset="1" stop-color="#FFFAD6"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  <filter id="mono">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.65" intercept="0.35"/>
        <feFuncG type="linear" slope="0.65" intercept="0.35"/>
        <feFuncB type="linear" slope="0.65" intercept="0.35"/>
      </feComponentTransfer>
    </filter>
  </defs>

    <!-- glow behind abdomen -->
  <g filter="url(#mono)">
  <circle cx="512" cy="622" r="300" fill="url(#halo)"/>

  <g transform="translate(512 500)">
    <!-- antennae -->
    <g stroke="#8B8ECB" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M -34 -220 Q -78 -286 -132 -302"/>
      <path d="M 34 -220 Q 78 -286 132 -302"/>
    </g>

    <!-- wings: two translucent pairs, angled out -->
    <g fill="#B9BCEB">
      <ellipse cx="-148" cy="-30" rx="66" ry="170" transform="rotate(28 -148 -30)" opacity="0.34"/>
      <ellipse cx="148" cy="-30" rx="66" ry="170" transform="rotate(-28 148 -30)" opacity="0.34"/>
      <ellipse cx="-120" cy="20" rx="54" ry="150" transform="rotate(14 -120 20)" opacity="0.22"/>
      <ellipse cx="120" cy="20" rx="54" ry="150" transform="rotate(-14 120 20)" opacity="0.22"/>
    </g>

    <!-- glowing abdomen -->
    <path d="M 0 -20 C 84 -20 118 68 118 142 C 118 240 62 300 0 300 C -62 300 -118 240 -118 142 C -118 68 -84 -20 0 -20 Z"
          fill="url(#belly)"/>
    <path d="M 0 -20 C 84 -20 118 68 118 142 C 118 240 62 300 0 300 C -62 300 -118 240 -118 142 C -118 68 -84 -20 0 -20 Z"
          fill="none" stroke="#FFF6C9" stroke-width="6" opacity="0.6" filter="url(#soft)"/>

    <!-- thorax + head -->
    <ellipse cx="0" cy="-88" rx="96" ry="86" fill="#3A3D6E"/>
    <circle cx="0" cy="-186" r="62" fill="#2E3160"/>
    <!-- eye glints -->
    <circle cx="-22" cy="-196" r="9" fill="#C9CBEE" opacity="0.9"/>
    <circle cx="22" cy="-196" r="9" fill="#C9CBEE" opacity="0.9"/>
  </g>
</g>
</svg>
